<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 주석 편집기</title>
<style>
:root{--bg:#f4f6f5;--panel:#fff;--ink:#1f2a24;--mute:#6b7771;--line:#d9e0dc;--accent:#00a82d;--accent-ink:#fff;--checker:#e3e8e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--panel:#1b221f;--ink:#e7eeea;--mute:#98a59e;--line:#2f3a35;--accent:#2fd45e;--accent-ink:#06210f;--checker:#232b27}}
:root[data-theme="dark"]{--bg:#121715;--panel:#1b221f;--ink:#e7eeea;--mute:#98a59e;--line:#2f3a35;--accent:#2fd45e;--accent-ink:#06210f;--checker:#232b27}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
button,label.btn{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary,label.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.4;cursor:default}
#landing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#landing h1{font-size:30px;margin:0 0 8px}
#landing p{color:var(--mute);margin:0 0 24px}
.drop{width:min(560px,100%);padding:48px 24px;border:2px dashed var(--line);border-radius:14px;background:var(--panel)}
.drop.hot{border-color:var(--accent)}
.drop label{font-size:16px;padding:12px 28px}
.drop small{display:block;margin-top:16px;color:var(--mute)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar.sub{font-size:13px;color:var(--mute);min-height:48px}
.sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.grp{display:none;gap:12px;align-items:center;flex-wrap:wrap}
.grp.show{display:flex}
input[type=range]{width:120px;accent-color:var(--accent)}
input[type=color]{width:36px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.stage{position:relative;line-height:0;max-width:100%;background:repeating-conic-gradient(var(--checker) 0 25%,transparent 0 50%) 0 0/16px 16px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
canvas{display:block;max-width:100%;max-height:calc(100vh - 190px);width:auto;height:auto;touch-action:none}
.ti{position:absolute;margin:0;padding:0;border:1px dashed var(--accent);background:rgba(255,255,255,.6);outline:none;font-weight:700;line-height:1.2;min-width:60px;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
</style>
</head>
<body>
<section id="landing">
  <h1>사진에 주석 달기</h1>
  <p id="landingHint">영역을 표시하고, 텍스트를 달고, 필요 없는 건 지우세요.</p>
  <div class="drop" id="drop">
    <label class="btn primary">파일 선택<input id="file" type="file" accept="image/*" hidden></label>
    <div style="margin-top:14px">또는 파일을 끌어다 놓기</div>
    <small>이미지 파일 형식 지원 (최대 100MB)</small>
  </div>
</section>

<section id="app" hidden>
  <div class="bar" role="toolbar" aria-label="도구">
    <button id="t-rect" class="on">영역 표시</button>
    <button id="t-text">텍스트</button>
    <button id="t-erase">지우기</button>
    <div class="sp">
      <button id="undo" disabled>되돌리기</button>
      <label class="btn">새 이미지<input id="file2" type="file" accept="image/*" hidden></label>
      <button id="save" class="primary">다운로드</button>
    </div>
  </div>
  <div class="bar sub">
    <div class="grp show" id="g-rect">
      <label>색상 <input id="color1" type="color" value="#ff3b30"></label>
      <span>이미지 위를 드래그해 영역을 표시합니다.</span>
    </div>
    <div class="grp" id="g-text">
      <label>색상 <input id="color2" type="color" value="#ff3b30"></label>
      <label>크기 <input id="tsize" type="range" min="12" max="200" value="48"></label>
      <span>클릭해서 입력하고, 글자를 끌어서 옮깁니다. 글자를 누르면 수정됩니다.</span>
    </div>
    <div class="grp" id="g-erase">
      <div class="seg" role="group" aria-label="지우기 방식">
        <button id="m-anno" class="on">주석 지우기</button>
        <button id="m-pixel">이미지 지우기</button>
      </div>
      <label id="esizeWrap" hidden>브러시 <input id="esize" type="range" min="4" max="150" value="30"></label>
      <span id="ehint">지울 영역 표시나 텍스트를 클릭하거나 드래그합니다.</span>
    </div>
  </div>
  <main>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  </main>
</section>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
  const base=document.createElement('canvas'),bctx=base.getContext('2d');
  const FONT='"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';
  let tool='rect',emode='anno',annos=[],history=[],drag=null,editing=null,loaded=false;

  function setTool(t){
    tool=t;commitText();
    ['rect','text','erase'].forEach(k=>{$('t-'+k).classList.toggle('on',k===t);$('g-'+k).classList.toggle('show',k===t)});
    cv.style.cursor=t==='text'?'text':'crosshair';
  }
  ['rect','text','erase'].forEach(k=>$('t-'+k).onclick=()=>setTool(k));
  function setMode(m){
    emode=m;
    $('m-anno').classList.toggle('on',m==='anno');$('m-pixel').classList.toggle('on',m==='pixel');
    $('esizeWrap').hidden=m!=='pixel';
    $('ehint').textContent=m==='anno'?'지울 영역 표시나 텍스트를 클릭하거나 드래그합니다.':'드래그해서 이미지의 일부를 투명하게 지웁니다.';
  }
  $('m-anno').onclick=()=>setMode('anno');$('m-pixel').onclick=()=>setMode('pixel');

  function showImage(img){
    base.width=cv.width=img.naturalWidth;base.height=cv.height=img.naturalHeight;
    bctx.clearRect(0,0,base.width,base.height);bctx.drawImage(img,0,0);
    annos=[];history=[];loaded=true;$('undo').disabled=true;
    $('landing').hidden=true;$('app').hidden=false;
    render();
  }
  function load(file){
    if(!file||!file.type.startsWith('image/'))return;
    if(file.size>100*1024*1024){alert('파일 크기는 최대 100MB까지 가능합니다.');return}
    const img=new Image();
    const objectUrl=URL.createObjectURL(file);
    img.onload=()=>{showImage(img);URL.revokeObjectURL(objectUrl)};
    img.onerror=()=>{URL.revokeObjectURL(objectUrl);alert('이미지를 불러오지 못했습니다. 다른 파일을 선택해 주세요.')};
    img.src=objectUrl;
  }
  function loadFromUrl(){
    const params=new URLSearchParams(window.location.search);
    const imageUrl=params.get('image');
    if(!imageUrl)return;
    $('landingHint').textContent='연결된 이미지를 불러오는 중입니다…';
    const img=new Image();
    // 외부 이미지도 캔버스 편집 및 PNG 다운로드가 가능하도록 CORS 요청
    img.crossOrigin='anonymous';
    img.onload=()=>showImage(img);
    img.onerror=()=>{
      $('landingHint').textContent='이미지를 자동으로 불러오지 못했습니다. 아래에서 파일을 직접 선택해 주세요.';
      alert('전달된 이미지 주소를 불러오지 못했습니다. 이미지 서버의 CORS 설정에 따라 자동 편집이 제한될 수 있습니다.');
    };
    try{img.src=imageUrl}catch(err){img.onerror()}
  }
  $('file').onchange=e=>load(e.target.files[0]);
  $('file2').onchange=e=>load(e.target.files[0]);
  const drop=$('drop');
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('hot')};
  drop.ondragleave=()=>drop.classList.remove('hot');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hot');load(e.dataTransfer.files[0])};

  function drawRect(a){
    const lw=Math.max(2,cv.width/300);
    ctx.save();ctx.fillStyle=a.color+'33';ctx.strokeStyle=a.color;ctx.lineWidth=lw;
    ctx.fillRect(a.x,a.y,a.w,a.h);ctx.strokeRect(a.x,a.y,a.w,a.h);ctx.restore();
  }
  function drawText(a){
    ctx.save();ctx.font='700 '+a.size+'px '+FONT;ctx.fillStyle=a.color;ctx.textBaseline='top';ctx.fillText(a.text,a.x,a.y);ctx.restore();
  }
  function render(){
    ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(base,0,0);
    annos.forEach(a=>{if(a===editing)return;a.type==='rect'?drawRect(a):drawText(a)});
    if(drag&&drag.rect)drawRect(drag.rect);
  }
  function box(a){
    if(a.type==='rect')return a;
    ctx.save();ctx.font='700 '+a.size+'px '+FONT;const w=ctx.measureText(a.text).width;ctx.restore();
    return {x:a.x,y:a.y,w:w,h:a.size*1.2};
  }
  function hit(p,type){
    for(let i=annos.length-1;i>=0;i--){
      const a=annos[i];if(type&&a.type!==type)continue;
      const b=box(a);
      if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return a;
    }
    return null;
  }
  function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
  function scale(){return cv.getBoundingClientRect().width/cv.width}

  function snap(withBase){
    history.push({annos:JSON.stringify(annos),base:withBase?bctx.getImageData(0,0,base.width,base.height):null});
    if(history.length>25)history.shift();
    $('undo').disabled=false;
  }
  $('undo').onclick=()=>{
    commitText();
    const h=history.pop();if(!h)return;
    annos=JSON.parse(h.annos);if(h.base)bctx.putImageData(h.base,0,0);
    $('undo').disabled=!history.length;render();
  };

  /* text editor */
  let ed=null;
  function startText(x,y,a){
    commitText();
    const s=scale();
    const size=a?a.size:+$('tsize').value,color=a?a.color:$('color2').value;
    const inp=document.createElement('input');
    inp.className='ti';inp.type='text';inp.value=a?a.text:'';
    inp.style.cssText='left:'+(x*s)+'px;top:'+(y*s)+'px;font-size:'+(size*s)+'px;color:'+color;
    inp.setAttribute('aria-label','텍스트 입력');
    stage.appendChild(inp);
    ed={inp,a,x,y,size,color};editing=a||null;render();
    setTimeout(()=>inp.focus(),0);
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commitText()}if(e.key==='Escape'){inp.value=a?a.text:'';commitText()}};
    inp.onblur=()=>commitText();
  }
  function commitText(){
    if(!ed)return;
    const {inp,a,x,y,size,color}=ed;ed=null;
    const v=inp.value.trim();
    inp.onblur=null;inp.remove();editing=null;
    if(a){
      if(!v){snap();annos.splice(annos.indexOf(a),1)}
      else if(v!==a.text){snap();a.text=v}
    }else if(v){snap();annos.push({type:'text',x,y,text:v,size,color})}
    render();
  }

  cv.addEventListener('pointerdown',e=>{
    if(!loaded)return;
    const p=pos(e);
    if(tool==='text'){
      const a=hit(p,'text');
      if(a){e.preventDefault();cv.setPointerCapture(e.pointerId);drag={move:a,dx:p.x-a.x,dy:p.y-a.y,moved:false}}
      else{e.preventDefault();startText(p.x,p.y,null)}
      return;
    }
    cv.setPointerCapture(e.pointerId);
    if(tool==='rect'){commitText();drag={start:p,rect:{type:'rect',x:p.x,y:p.y,w:0,h:0,color:$('color1').value}}}
    else if(emode==='anno'){
      drag={del:true,snapped:false};delAt(p);
    }else{
      snap(true);drag={last:p};dot(p);render();
    }
  });
  function delAt(p){
    const a=hit(p);
    if(a){if(!drag.snapped){snap();drag.snapped=true}annos.splice(annos.indexOf(a),1);render()}
  }
  function dot(p){
    const s=+$('esize').value;bctx.save();bctx.globalCompositeOperation='destination-out';
    bctx.beginPath();bctx.arc(p.x,p.y,s/2,0,Math.PI*2);bctx.fill();bctx.restore();
  }
  cv.addEventListener('pointermove',e=>{
    if(!drag)return;const p=pos(e);
    if(drag.move){
      if(!drag.moved){snap();drag.moved=true}
      drag.move.x=p.x-drag.dx;drag.move.y=p.y-drag.dy;render();
    }else if(drag.rect){
      const s=drag.start;
      Object.assign(drag.rect,{x:Math.min(s.x,p.x),y:Math.min(s.y,p.y),w:Math.abs(p.x-s.x),h:Math.abs(p.y-s.y)});render();
    }else if(drag.del){delAt(p)}
    else if(drag.last){
      bctx.save();bctx.globalCompositeOperation='destination-out';bctx.lineWidth=+$('esize').value;bctx.lineCap='round';
      bctx.beginPath();bctx.moveTo(drag.last.x,drag.last.y);bctx.lineTo(p.x,p.y);bctx.stroke();bctx.restore();
      drag.last=p;render();
    }
  });
  function end(){
    if(!drag)return;const d=drag;drag=null;
    if(d.move&&!d.moved)startText(d.move.x,d.move.y,d.move);
    if(d.rect&&d.rect.w>3&&d.rect.h>3){snap();annos.push(d.rect)}
    render();
  }
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!ed){e.preventDefault();$('undo').click()}
  });
  $('save').onclick=()=>{
    commitText();
    cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='edited.png';document.body.appendChild(a);a.click();a.remove()},'image/png');
  };
  setTool('rect');
  loadFromUrl();
})();
</script>
</body>
</html>
