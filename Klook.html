<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 주석 편집기</title>
<style>
:root{--bg:#f4f6f5;--panel:#fff;--ink:#1f2a24;--mute:#6b7771;--line:#d9e0dc;--accent:#00a82d;--accent-ink:#fff;--checker:#e3e8e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--panel:#1b221f;--ink:#e7eeea;--mute:#98a59e;--line:#2f3a35;--accent:#2fd45e;--accent-ink:#06210f;--checker:#232b27}}
:root[data-theme="dark"]{--bg:#121715;--panel:#1b221f;--ink:#e7eeea;--mute:#98a59e;--line:#2f3a35;--accent:#2fd45e;--accent-ink:#06210f;--checker:#232b27}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
button,label.btn{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary,label.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.4;cursor:default}
#landing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#landing h1{font-size:30px;margin:0 0 8px}
#landing p{color:var(--mute);margin:0 0 24px}
.drop{width:min(560px,100%);padding:48px 24px;border:2px dashed var(--line);border-radius:14px;background:var(--panel)}
.drop.hot{border-color:var(--accent)}
.drop label{font-size:16px;padding:12px 28px}
.drop small{display:block;margin-top:16px;color:var(--mute)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar.sub{font-size:13px;color:var(--mute);min-height:48px}
.sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.grp{display:none;gap:12px;align-items:center;flex-wrap:wrap}
.grp.show{display:flex}
input[type=range]{width:120px;accent-color:var(--accent)}
input[type=color]{width:36px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:auto}
.stage{position:relative;line-height:0;max-width:100%;background:repeating-conic-gradient(var(--checker) 0 25%,transparent 0 50%) 0 0/16px 16px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
canvas{display:block;max-width:100%;width:auto;height:auto;touch-action:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.page{max-width:100%}
.ph{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;color:var(--mute)}
.ph button{padding:4px 10px;font-size:12px}
.ti{position:absolute;margin:0;padding:0;border:1px dashed var(--accent);background:rgba(255,255,255,.6);outline:none;font-weight:700;line-height:1.2;min-width:60px;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
</style>
</head>
<body>
<section id="landing">
  <h1>사진에 주석 달기</h1>
  <p>영역을 표시하고, 텍스트를 달고, 필요 없는 건 지우세요. 여러 장도 한 번에 불러올 수 있어요.</p>
  <div class="drop" id="drop">
    <label class="btn primary">파일 선택<input id="file" type="file" accept="image/*" multiple hidden></label>
    <div style="margin-top:14px">또는 파일을 끌어다 놓기</div>
    <small>이미지 여러 장 선택 가능 (장당 최대 100MB)</small>
  </div>
</section>

<section id="app" hidden>
  <div class="bar" role="toolbar" aria-label="도구">
    <button id="t-rect" class="on">영역 표시</button>
    <button id="t-text">텍스트</button>
    <button id="t-erase">지우기</button>
    <div class="sp">
      <button id="undo" disabled>되돌리기</button>
      <label class="btn">이미지 추가<input id="file2" type="file" accept="image/*" multiple hidden></label>
      <button id="saveAll" class="primary">한 장으로 저장</button>
    </div>
  </div>
  <div class="bar sub">
    <div class="grp show" id="g-rect">
      <label>색상 <input id="color1" type="color" value="#ff3b30"></label>
      <span>이미지 위를 드래그해 영역을 표시합니다. 아래로 스크롤하면 다음 이미지가 나옵니다.</span>
    </div>
    <div class="grp" id="g-text">
      <label>색상 <input id="color2" type="color" value="#ff3b30"></label>
      <label>크기 <input id="tsize" type="range" min="12" max="400" value="48"></label>
      <span>클릭해서 입력하고, 글자를 끌어서 옮깁니다. 글자를 누르면 수정됩니다.</span>
    </div>
    <div class="grp" id="g-erase">
      <div class="seg" role="group" aria-label="지우기 방식">
        <button id="m-anno" class="on">주석 지우기</button>
        <button id="m-pixel">이미지 지우기</button>
      </div>
      <label id="esizeWrap" hidden>브러시 <input id="esize" type="range" min="4" max="300" value="30"></label>
      <span id="ehint">지울 영역 표시나 텍스트를 클릭하거나 드래그합니다.</span>
    </div>
  </div>
  <main><div id="pages"></div></main>
</section>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const FONT='"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif';
  let tool='rect',emode='anno',pages=[],history=[],drag=null,ed=null;

  function setTool(t){
    tool=t;commitText();
    ['rect','text','erase'].forEach(k=>{$('t-'+k).classList.toggle('on',k===t);$('g-'+k).classList.toggle('show',k===t)});
    pages.forEach(p=>p.cv.style.cursor=t==='text'?'text':'crosshair');
  }
  ['rect','text','erase'].forEach(k=>$('t-'+k).onclick=()=>setTool(k));
  function setMode(m){
    emode=m;
    $('m-anno').classList.toggle('on',m==='anno');$('m-pixel').classList.toggle('on',m==='pixel');
    $('esizeWrap').hidden=m!=='pixel';
    $('ehint').textContent=m==='anno'?'지울 영역 표시나 텍스트를 클릭하거나 드래그합니다.':'드래그해서 이미지의 일부를 투명하게 지웁니다.';
  }
  $('m-anno').onclick=()=>setMode('anno');$('m-pixel').onclick=()=>setMode('pixel');

  function addFiles(files){
    [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
      if(f.size>100*1024*1024){alert(f.name+': 최대 100MB까지 가능합니다.');return}
      const img=new Image();
      img.onload=()=>{addPage(img);URL.revokeObjectURL(img.src)};
      img.onerror=()=>alert(f.name+': 이미지를 불러오지 못했습니다.');
      img.src=URL.createObjectURL(f);
    });
  }
  // keep selection order even though loads finish at different times
  function pick(input){const fs=[...input.files];input.value='';
    const imgs=[];let n=0;
    fs.filter(f=>f.type.startsWith('image/')&&f.size<=100*1024*1024).forEach((f,i)=>{
      const img=new Image();
      img.onload=()=>{imgs[i]=img;if(++n===imgs.filter(()=>true).length||n===fs.length)flush()};
      img.onerror=()=>{imgs[i]=null;n++;flush()};
      img.src=URL.createObjectURL(f);
    });
    let done=false;
    function flush(){if(done||n<fs.filter(f=>f.type.startsWith('image/')&&f.size<=100*1024*1024).length)return;done=true;imgs.forEach(im=>{if(im){addPage(im);URL.revokeObjectURL(im.src)}})}
  }
  $('file').onchange=e=>pick(e.target);
  $('file2').onchange=e=>pick(e.target);
  const drop=$('drop');
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('hot')};
  drop.ondragleave=()=>drop.classList.remove('hot');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hot');
    const dt=new DataTransfer();[...e.dataTransfer.files].forEach(f=>dt.items.add(f));
    const t={files:dt.files,value:''};pick(t)};

  function addPage(img){
    const wrap=document.createElement('div');wrap.className='page';
    const stage=document.createElement('div');stage.className='stage';
    const cv=document.createElement('canvas');
    const base=document.createElement('canvas');
    base.width=cv.width=img.naturalWidth;base.height=cv.height=img.naturalHeight;
    const bctx=base.getContext('2d');bctx.drawImage(img,0,0);
    const p={wrap,stage,cv,ctx:cv.getContext('2d'),base,bctx,annos:[],editing:null};
    const head=document.createElement('div');head.className='ph';
    const title=document.createElement('span');
    const btns=document.createElement('span');
    const sv=document.createElement('button');sv.textContent='이 이미지 저장';
    const rm=document.createElement('button');rm.textContent='삭제';
    btns.append(sv,' ',rm);head.append(title,btns);
    stage.appendChild(cv);wrap.append(head,stage);$('pages').appendChild(wrap);
    p.title=title;pages.push(p);renumber();
    cv.style.cursor=tool==='text'?'text':'crosshair';
    sv.onclick=()=>{commitText();try{cv.toBlob(b=>dl(b,'edited-'+(pages.indexOf(p)+1)+'.png'),'image/png')}catch(err){taintMsg()}};
    rm.onclick=()=>{
      if(!confirm('이 이미지를 삭제할까요?'))return;
      commitText();pages.splice(pages.indexOf(p),1);history=history.filter(h=>h.p!==p);
      wrap.remove();renumber();$('undo').disabled=!history.length;
      if(!pages.length){$('app').hidden=true;$('landing').hidden=false}
    };
    bind(p);render(p);
    $('landing').hidden=true;$('app').hidden=false;
  }
  function renumber(){pages.forEach((p,i)=>p.title.textContent='이미지 '+(i+1)+' / '+pages.length)}
  function dl(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}

  function drawRect(c,a,w){
    const lw=Math.max(2,w/300);
    c.save();c.fillStyle=a.color+'33';c.strokeStyle=a.color;c.lineWidth=lw;
    c.fillRect(a.x,a.y,a.w,a.h);c.strokeRect(a.x,a.y,a.w,a.h);c.restore();
  }
  function drawText(c,a){c.save();c.font='700 '+a.size+'px '+FONT;c.fillStyle=a.color;c.textBaseline='top';c.fillText(a.text,a.x,a.y);c.restore()}
  function render(p){
    const c=p.ctx;c.clearRect(0,0,p.cv.width,p.cv.height);c.drawImage(p.base,0,0);
    p.annos.forEach(a=>{if(a===p.editing)return;a.type==='rect'?drawRect(c,a,p.cv.width):drawText(c,a)});
    if(drag&&drag.p===p&&drag.rect)drawRect(c,drag.rect,p.cv.width);
  }
  function box(p,a){
    if(a.type==='rect')return a;
    p.ctx.save();p.ctx.font='700 '+a.size+'px '+FONT;const w=p.ctx.measureText(a.text).width;p.ctx.restore();
    return {x:a.x,y:a.y,w:w,h:a.size*1.2};
  }
  function hit(p,pt,type){
    for(let i=p.annos.length-1;i>=0;i--){
      const a=p.annos[i];if(type&&a.type!==type)continue;
      const b=box(p,a);
      if(pt.x>=b.x&&pt.x<=b.x+b.w&&pt.y>=b.y&&pt.y<=b.y+b.h)return a;
    }
    return null;
  }
  function pos(e,p){const r=p.cv.getBoundingClientRect();return {x:(e.clientX-r.left)*p.cv.width/r.width,y:(e.clientY-r.top)*p.cv.height/r.height}}
  function scale(p){return p.cv.getBoundingClientRect().width/p.cv.width}

  function snap(p,withBase){
    history.push({p,annos:JSON.stringify(p.annos),base:withBase?p.bctx.getImageData(0,0,p.base.width,p.base.height):null});
    if(history.length>25)history.shift();
    $('undo').disabled=false;
  }
  $('undo').onclick=()=>{
    commitText();
    const h=history.pop();if(!h)return;
    h.p.annos=JSON.parse(h.annos);if(h.base)h.p.bctx.putImageData(h.base,0,0);
    $('undo').disabled=!history.length;render(h.p);
  };

  function startText(p,x,y,a){
    commitText();
    const s=scale(p);
    const size=a?a.size:+$('tsize').value,color=a?a.color:$('color2').value;
    const inp=document.createElement('input');
    inp.className='ti';inp.type='text';inp.value=a?a.text:'';
    inp.style.cssText='left:'+(x*s)+'px;top:'+(y*s)+'px;font-size:'+(size*s)+'px;color:'+color;
    inp.setAttribute('aria-label','텍스트 입력');
    p.stage.appendChild(inp);
    ed={p,inp,a,x,y,size,color};p.editing=a||null;render(p);
    setTimeout(()=>inp.focus(),0);
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commitText()}if(e.key==='Escape'){inp.value=a?a.text:'';commitText()}};
    inp.onblur=()=>commitText();
  }
  function commitText(){
    if(!ed)return;
    const {p,inp,a,x,y,size,color}=ed;ed=null;
    const v=inp.value.trim();
    inp.onblur=null;inp.remove();p.editing=null;
    if(a){
      if(!v){snap(p);p.annos.splice(p.annos.indexOf(a),1)}
      else if(v!==a.text){snap(p);a.text=v}
    }else if(v){snap(p);p.annos.push({type:'text',x,y,text:v,size,color})}
    render(p);
  }
  function delAt(pt){
    const a=hit(drag.p,pt);
    if(a){if(!drag.snapped){snap(drag.p);drag.snapped=true}drag.p.annos.splice(drag.p.annos.indexOf(a),1);render(drag.p)}
  }

  function bind(p){
    const cv=p.cv;
    cv.addEventListener('pointerdown',e=>{
      const pt=pos(e,p);
      if(tool==='text'){
        const a=hit(p,pt,'text');e.preventDefault();
        if(a){cv.setPointerCapture(e.pointerId);drag={p,move:a,dx:pt.x-a.x,dy:pt.y-a.y,moved:false}}
        else startText(p,pt.x,pt.y,null);
        return;
      }
      cv.setPointerCapture(e.pointerId);
      if(tool==='rect'){commitText();drag={p,start:pt,rect:{type:'rect',x:pt.x,y:pt.y,w:0,h:0,color:$('color1').value}}}
      else if(emode==='anno'){drag={p,del:true,snapped:false};delAt(pt)}
      else{snap(p,true);drag={p,last:pt};erase(p,pt,pt)}
    });
    cv.addEventListener('pointermove',e=>{
      if(!drag||drag.p!==p)return;const pt=pos(e,p);
      if(drag.move){
        if(!drag.moved){snap(p);drag.moved=true}
        drag.move.x=pt.x-drag.dx;drag.move.y=pt.y-drag.dy;render(p);
      }else if(drag.rect){
        const s=drag.start;
        Object.assign(drag.rect,{x:Math.min(s.x,pt.x),y:Math.min(s.y,pt.y),w:Math.abs(pt.x-s.x),h:Math.abs(pt.y-s.y)});render(p);
      }else if(drag.del){delAt(pt)}
      else if(drag.last){erase(p,drag.last,pt);drag.last=pt}
    });
    function end(){
      if(!drag||drag.p!==p)return;const d=drag;drag=null;
      if(d.move&&!d.moved)startText(p,d.move.x,d.move.y,d.move);
      if(d.rect&&d.rect.w>3&&d.rect.h>3){snap(p);p.annos.push(d.rect)}
      render(p);
    }
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  }
  function erase(p,a,b){
    const c=p.bctx;c.save();c.globalCompositeOperation='destination-out';c.lineWidth=+$('esize').value;c.lineCap='round';
    c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();c.restore();render(p);
  }

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!ed){e.preventDefault();$('undo').click()}
  });
  $('saveAll').onclick=()=>{try{saveAll()}catch(err){taintMsg()}};
  function saveAll(){
    commitText();if(!pages.length)return;
    const W=Math.max(...pages.map(p=>p.cv.width));
    const hs=pages.map(p=>Math.round(p.cv.height*W/p.cv.width));
    const H=hs.reduce((a,b)=>a+b,0);
    if(H>30000||W*H>2.5e8){alert('이미지가 너무 커서 한 장으로 합칠 수 없습니다. 각 이미지의 "이 이미지 저장"을 사용해 주세요.');return}
    const o=document.createElement('canvas');o.width=W;o.height=H;const c=o.getContext('2d');
    let y=0;pages.forEach((p,i)=>{c.drawImage(p.cv,0,y,W,hs[i]);y+=hs[i]});
    o.toBlob(b=>dl(b,'edited-all.png'),'image/png');
  }
  function taintMsg(){alert('이 이미지는 원본 서버가 외부 사용(CORS)을 허용하지 않아 저장할 수 없습니다. 이미지를 같은 사이트에 두거나 서버의 CORS를 허용해 주세요.')}
  setTool('rect');
  // ?image=URL (여러 개 가능: ?image=a&image=b) 로 이미지 불러오기
  const urls=new URLSearchParams(location.search).getAll('image');
  Promise.all(urls.map(u=>new Promise(res=>{
    const im=new Image();im.crossOrigin='anonymous';im.referrerPolicy='no-referrer';
    im.onload=()=>res(im);
    im.onerror=()=>{const i2=new Image();i2.referrerPolicy='no-referrer';i2.onload=()=>res(i2);i2.onerror=()=>res(null);i2.src=u}; // CORS 불가 시 보기만 가능
    im.src=u;
  }))).then(ims=>ims.forEach(im=>im&&addPage(im)));
})();
</script>
</body>
</html>
